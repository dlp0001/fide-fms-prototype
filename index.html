<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FIDE Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dark product bar + demo guide on top. FMS = cool, dense back office (sidebar + work area). Portal = warm ChessID-styled front office in a centred column. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #EDF0F4; --line: #DCE1E8; --line-2: #C6CDD8;
  --text: #121722; --text-2: #566072; --text-3: #6E7888;
  --accent: #2350C0; --accent-ink: #FFFFFF; --accent-soft: #E6EDFB;
  --paper: #FAF8F4; --p-surface: #FFFFFF; --p-surface-2: #F3F0E9; --p-line: #E3DED2; --p-text-2: #6B6558;
  --gold: #7E5F22; --gold-hi: #E0C288; --gold-mid: #B08A3E; --gold-soft: #F6EEDB;
  --good: #2C7550; --good-soft: #E3F1E8; --warn: #8A5D0B; --warn-soft: #FBF0D9; --bad: #AE3427; --bad-soft: #FBE6E2;
  --chrome: #14130F; --chrome-2: #26241E; --chrome-line: #3A372F; --chrome-text: #F2EEE6; --chrome-dim: #A39C8C;
  --shadow: 0 1px 2px rgba(18, 23, 34, .05), 0 6px 20px -12px rgba(18, 23, 34, .2);
  --scrim: rgba(12, 14, 18, .45);
  --sans: "IBM Plex Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1217; --surface: #171B22; --surface-2: #1E232C; --line: #2A303A; --line-2: #3A4250;
    --text: #ECEFF4; --text-2: #A0A9B8; --text-3: #8A94A4;
    --accent: #86A8F6; --accent-ink: #0D1424; --accent-soft: #1C2842;
    --paper: #13120F; --p-surface: #1C1A16; --p-surface-2: #24211B; --p-line: #353027; --p-text-2: #A39B8B;
    --gold: #D9B266; --gold-hi: #F0DCAE; --gold-mid: #C69C50; --gold-soft: #2E2617;
    --good: #73C496; --good-soft: #16291E; --warn: #E3B45C; --warn-soft: #30250F; --bad: #F2907F; --bad-soft: #371B17;
    --chrome: #0A0A08; --chrome-2: #1C1B17; --chrome-line: #34312A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 24px -14px rgba(0, 0, 0, .7);
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1217; --surface: #171B22; --surface-2: #1E232C; --line: #2A303A; --line-2: #3A4250;
  --text: #ECEFF4; --text-2: #A0A9B8; --text-3: #8A94A4;
  --accent: #86A8F6; --accent-ink: #0D1424; --accent-soft: #1C2842;
  --paper: #13120F; --p-surface: #1C1A16; --p-surface-2: #24211B; --p-line: #353027; --p-text-2: #A39B8B;
  --gold: #D9B266; --gold-hi: #F0DCAE; --gold-mid: #C69C50; --gold-soft: #2E2617;
  --good: #73C496; --good-soft: #16291E; --warn: #E3B45C; --warn-soft: #30250F; --bad: #F2907F; --bad-soft: #371B17;
  --chrome: #0A0A08; --chrome-2: #1C1B17; --chrome-line: #34312A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 24px -14px rgba(0, 0, 0, .7);
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.small { font-size: 12.5px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(22px, 3vw, 28px); font-weight: 600; line-height: 1.2; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* top: product bar + guide */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.chrome { background: var(--chrome); color: var(--chrome-text); }
.chrome-in { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 54px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mark { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
.mark-k { background: var(--chrome-text); color: var(--chrome); font-size: 12px; letter-spacing: .14em; padding: 3px 7px 3px 8px; border-radius: 3px; }
.mark-t { font-size: 13px; color: var(--chrome-dim); font-weight: 500; }
.prod { display: flex; gap: 2px; background: var(--chrome-2); padding: 3px; border-radius: 8px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.prod button { border: 0; background: none; color: var(--chrome-dim); padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 500; display: flex; gap: 6px; align-items: baseline; }
.prod button small { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.prod button:hover { color: var(--chrome-text); }
.prod button[aria-pressed="true"] { background: var(--chrome-text); color: var(--chrome); }
.chrome-r { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rolepick { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--chrome-dim); }
.rolepick select { background: var(--chrome-2); color: var(--chrome-text); border: 1px solid var(--chrome-line); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
.today { font-size: 11.5px; color: var(--chrome-dim); border: 1px solid var(--chrome-line); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.cbtn { background: none; border: 1px solid var(--chrome-line); color: var(--chrome-text); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.cbtn:hover { background: var(--chrome-2); }
.guide { background: var(--surface); border-bottom: 1px solid var(--line); }
.guide-in { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.g-step { font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
.g-bar { width: 90px; height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; flex: none; }
.g-bar i { display: block; height: 100%; background: var(--accent); }
.g-text { flex: 1 1 260px; min-width: 0; font-size: 13.5px; }

/* shared components */
.btn { border: 1px solid transparent; border-radius: 8px; padding: 9px 16px; font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.small { padding: 6px 12px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }
.linkbtn:hover { text-decoration: underline; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 18px 20px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.spread { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--text-2); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge { margin-left: auto; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; border-radius: 99px; padding: 0 7px; line-height: 18px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; flex: none; }
.err { color: var(--bad); font-size: 13px; font-weight: 500; }
.note { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text-2); }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12px; font-weight: 600; color: var(--text-2); }
.field input, .field select, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.field textarea { resize: vertical; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; }
.check input { margin-top: 3px; accent-color: var(--accent); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: top; }
th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); font-weight: 600; background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 600; border-bottom: 0; }
.tscroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.tscroll table { min-width: 480px; }
.tscroll tr:last-child td { border-bottom: 0; }

/* FMS */
.fms { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 110px); }
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 10px; gap: 14px; padding-left: max(10px, env(safe-area-inset-left, 0px)); }
.side-h { padding: 0 8px; display: grid; }
.side-h b { font-size: 14px; }
.side-h span { font-size: 12px; color: var(--text-2); }
.snav { display: grid; gap: 2px; }
.snav-i { display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--text-2); font-weight: 500; white-space: nowrap; }
.snav-i:hover { background: var(--surface-2); color: var(--text); }
.snav-i.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.snav-i .soon { margin-left: auto; font-size: 10.5px; color: var(--text-3); font-weight: 500; }
.side-f { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 10px 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); }
.fmain { padding: 24px 28px 64px; display: grid; gap: 20px; align-content: start; min-width: 0; }
.phead-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: grid; gap: 4px; }
.kpi .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .s { font-size: 12.5px; color: var(--text-2); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.list { display: grid; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .t { display: grid; gap: 2px; min-width: 0; }
.li .t b { font-weight: 600; }
.li .t span { font-size: 12.5px; color: var(--text-2); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fpill { border: 1px solid var(--line-2); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; color: var(--text-2); }
.fpill[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: 214px; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 0 2px; }
.kcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 5px; cursor: pointer; box-shadow: var(--shadow); }
.kcard:hover { border-color: var(--line-2); }
.kcard.mine { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
.kcard .id { font-size: 11.5px; color: var(--text-2); }
.kcard b { font-size: 13px; font-weight: 600; line-height: 1.3; }
.kcard .f { font-size: 12px; color: var(--text-2); }
.kcard .ft { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.bars { display: grid; gap: 14px; }
.barrow { display: grid; gap: 5px; }
.barrow .lbl { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; flex-wrap: wrap; }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; }
.bar i.req { background: var(--line-2); }
.bar i.app { background: var(--accent); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.track { list-style: none; margin: 0; padding: 0; display: grid; }
.track li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 7px 0; position: relative; }
.track li::before { content: ""; position: absolute; left: 8px; top: 22px; bottom: -8px; width: 2px; background: var(--line); }
.track li:last-child::before { display: none; }
.tdot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); margin-top: 1px; z-index: 1; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.track li.done .tdot { background: var(--good); border-color: var(--good); color: var(--surface); }
.track li.cur .tdot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.track li.bad .tdot { background: var(--bad); border-color: var(--bad); }
.track b { display: block; font-weight: 600; font-size: 13.5px; }
.track li.todo b { color: var(--text-2); font-weight: 500; }
.track small { font-size: 12px; color: var(--text-2); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.checks li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.checks .ok { color: var(--good); font-weight: 700; }
.checks .no { color: var(--bad); font-weight: 700; }
.checks span small { display: block; color: var(--text-2); font-size: 12px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.log li { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; font-size: 12.5px; }
.log time { color: var(--text-2); font-family: var(--mono); font-size: 11.5px; padding-top: 1px; }
.log b { font-weight: 600; }
.act { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent), var(--shadow); }
.waiting { display: flex; gap: 12px; align-items: center; }
.crit { display: grid; gap: 8px; }
.crow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13.5px; }
.pills { display: flex; gap: 4px; }
.pill { width: 34px; height: 30px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 600; font-family: var(--mono); }
.pill:hover { border-color: var(--accent); }
.pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scoregrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scoregrid div { background: var(--surface-2); border-radius: 7px; padding: 7px 8px; display: grid; gap: 1px; }
.scoregrid small { font-size: 11px; color: var(--text-2); line-height: 1.25; }
.scoregrid b { font-family: var(--mono); font-size: 15px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 0; }
.kv dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); font-weight: 600; }
.kv dd { margin: 2px 0 0; font-weight: 500; }
.stub { max-width: 640px; }
.arch { max-width: 1080px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
.layer { border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; border: 1px solid var(--line); background: var(--surface); }
.layer.front { border-color: var(--gold-mid); background: var(--gold-soft); }
.layer.core { border-color: var(--accent); background: var(--accent-soft); }
.layer h2 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.layer h2 small { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.mod { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; display: grid; gap: 2px; }
.mod b { font-size: 13px; font-weight: 600; }
.mod small { font-size: 11.5px; color: var(--text-2); }
.mod.live { border-color: var(--good); }
.flowdown { text-align: center; color: var(--text-2); font-size: 12px; letter-spacing: .06em; }
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }

/* Portal (front office, ChessID look) */
.portal { --bg: var(--paper); --surface: var(--p-surface); --surface-2: var(--p-surface-2); --line: var(--p-line); --text-2: var(--p-text-2); --accent: var(--gold); --accent-soft: var(--gold-soft); --accent-ink: var(--chrome); background: var(--bg); min-height: calc(100vh - 110px); }
.portal .btn.primary { background: linear-gradient(135deg, var(--gold-hi), var(--gold-mid)); color: #14130F; }
.phead { background: var(--surface); border-bottom: 1px solid var(--line); }
.phead-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pbrand { font-weight: 600; font-size: 16px; white-space: nowrap; }
.pbrand em { font-style: normal; color: var(--gold); }
.pnav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.pnav button { border: 0; background: none; padding: 7px 11px; border-radius: 7px; cursor: pointer; color: var(--text-2); white-space: nowrap; font-weight: 500; }
.pnav button:hover { color: var(--text); background: var(--surface-2); }
.pnav button.on { color: var(--text); background: var(--surface-2); box-shadow: inset 0 -2px 0 var(--gold-mid); }
.pwho { margin-left: auto; display: flex; gap: 9px; align-items: center; font-size: 13px; }
.pwho small { display: block; color: var(--text-2); font-size: 11.5px; }
.cid { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; }
.cid em { font-style: normal; background: linear-gradient(135deg, var(--gold-hi), var(--gold-mid)); color: #14130F; padding: 0 3px; border-radius: 2px; margin-left: 1px; }

function move(a, stage, who, what) { a.stage = stage; a.since = TODAY; const st = STG[stage]; a.due = st.sla ? addWD(TODAY, st.sla) : null; log(a, who, what); }
function canAct(r, a) {
  switch (a.stage) {
    case 'pitch': case 'check': return r === 'secretariat';
    case 'councillor': return r === 'councillor' && a.cont === ROLES.councillor.cont;
    case 'commission': return r === 'chair' || r === 'coordinator';
    case 'approval': return (r === 'management' && !a.approvals.management) || (r === 'treasurer' && !a.approvals.treasurer);
    case 'payment': return r === 'accounting';
    case 'report': return r === 'coordinator';
    default: return false;
  }
}
function chip(kind, text) { return `<span class="chip ${kind}"><span class="d"></span>${esc(text)}</span>`; }
function slaChip(a) {
  if (!STG[a.stage].sla || !a.due) return '';
  if (TODAY > a.due) return chip('bad', 'Overdue ' + wdBetween(a.due, TODAY) + ' d');
  if (TODAY === a.due) return chip('warn', 'Due today');
  return chip('good', 'Due ' + fmtS(a.due));
}
function stageChip(a) {
  if (a.stage === 'closed') return chip('good', 'Closed');
  if (a.stage === 'declined') return chip('bad', 'Declined');
  return chip('info', STG[a.stage].label);
}

/* ---------- demo guide ---------- */
function openF(role, id) { state.app = 'fms'; state.role = role; state.fview = 'app:' + id; state.form = {}; }
function openP(id) { state.app = 'portal'; state.signedIn = true; state.pview = 'app:' + id; state.form = {}; }
function guide() {
  const a = state.demoId && byId(state.demoId);
  if (!a && !state.signedIn) return { n: 1, text: 'A federation officer signs in to the Federation Portal with ChessID.', go: () => { state.app = 'portal'; state.pview = 'signin'; } };
  if (!a) return { n: 2, text: 'The federation applies for a grant: Grants → New application.', go: () => startWizard() };
  switch (a.stage) {
    case 'councillor': return { n: 3, text: 'Switch to FMS as Councillor · Africa and score ' + a.id + '.', go: () => openF('councillor', a.id) };
    case 'commission': return { n: 4, text: 'As Commission chair, set the grant amount and recommend ' + a.id + '.', go: () => openF('chair', a.id) };
    case 'approval': return a.approvals.management
      ? { n: 5, text: 'As Treasurer, approve ' + a.id + '. Management has already approved.', go: () => openF('treasurer', a.id) }
      : { n: 5, text: 'As Management, approve ' + a.id + '. The Treasurer approves in parallel.', go: () => openF('management', a.id) };
    case 'agreement': return { n: 6, text: 'Back in the Federation Portal: read the decision, sign the agreement, add bank details.', go: () => openP(a.id) };
    case 'payment': return { n: 7, text: 'As Accounting, verify the bank details and pay tranche 1.', go: () => openF('accounting', a.id) };
    case 'project': return { n: 8, text: 'In the Federation Portal, submit the final report for ' + a.id + '.', go: () => openP(a.id) };
    case 'report': return { n: 9, text: 'As Grants coordinator, approve the report and publish the results.', go: () => openF('coordinator', a.id) };
    case 'closed': return { n: 10, text: a.id + ' went from application to published result. The FMS overview shows the updated numbers.', go: () => { state.app = 'fms'; state.role = 'management'; state.fview = 'dashboard'; } };
    default: return { n: 10, text: a.id + ' was declined. Reset the demo to run the full path again.', go: () => openP(a.id) };
  }
}

      <label class="field"><span>What happened</span><textarea id="f-rsum" data-f="rsum" rows="3">${esc(f.rsum)}</textarea></label>
      <div class="pair"><label class="field"><span>Participants</span><input id="f-rpart" data-f="rpart" value="${esc(f.rpart)}"></label><label class="field"><span>Actually spent, USD</span><input id="f-rspent" class="mono" inputmode="numeric" data-f="rspent" value="${esc(f.rspent)}"></label></div>
      <label class="check"><input type="checkbox" id="f-consent" data-f="consent"${f.consent ? ' checked' : ''}> You may publish this report and its photos on the PDC website.</label>
      <p class="small muted">Prototype: 3 example photos and the receipts file are attached.</p>${errLine()}
      <div class="row"><button type="button" class="btn primary" data-act="report" data-arg="${a.id}">Submit report</button></div></section>`;
  }
  if (a.stage === 'closed') return `<section class="card pad row"><p class="muted" style="flex:1">This project is published on the PDC website.</p><button type="button" class="btn small ghost" data-act="public" data-arg="${a.id}">See the public page</button></section>`;
  return '';
}
function pApp(a) {
  if (!a) return '<p>Application not found.</p>';
  return `<div><button type="button" class="linkbtn" data-act="pv" data-arg="grants">← Grants</button></div>
  <div class="phead-row"><div class="stack" style="gap:6px"><p class="eyebrow mono">${a.id} · season ${a.season}</p><h1>${esc(a.title)}</h1></div>${pStatus(a)}</div>
  <section class="card pad stack next"><p class="eyebrow">What happens next</p><p>${esc(pNext(a))}</p>${pTrack(a)}</section>
  ${pAction(a)}
  <div class="two">
    <section class="card pad stack"><h2>Your application</h2><p>${esc(a.summary)}</p><dl class="kv"><div><dt>Dates</dt><dd>${fmtS(a.start)} – ${fmt(a.end)}</dd></div><div><dt>Beneficiaries</dt><dd>${esc(a.benef)}</dd></div></dl>${budgetTable(a)}</section>
    <div class="stack">
      ${a.payments.length ? `<section class="card pad stack"><h2>Payments</h2><div class="list">${a.payments.map(p => `<div class="li"><div class="t"><b class="mono">${usd(p.amt)}</b><span>${esc(p.label)}</span></div>${p.status === 'paid' ? chip('good', 'Paid ' + fmtS(p.date)) : chip('', p.status)}</div>`).join('')}</div></section>` : ''}
      <section class="card pad stack"><h2>History</h2><ul class="log">${a.history.slice().reverse().map(h => `<li><time>${fmtS(h.d)}</time><span><b>${esc(h.who)}</b> · ${esc(h.what)}</span></li>`).join('')}</ul></section>
    </div></div>`;
}

/* ---------- architecture ---------- */
function renderArch() {
  const m = (t, s, live) => `<div class="mod${live ? ' live' : ''}"><b>${t}</b><small>${s}</small></div>`;
  return `<div class="arch">
  <div class="stack" style="gap:6px"><p class="eyebrow">How it fits together</p><h1>One system, two faces</h1><p class="muted" style="max-width:68ch">Federations work in the Portal. FIDE staff and commissions work in the Management System. Both read and write the same records, so nothing is retyped and every step is logged. Green outline: working in this prototype.</p></div>
  <section class="layer front"><h2>Federation Portal <small>front office · sign in with ChessID</small></h2><div class="mods">${m('Grants', 'apply, sign, report', 1)}${m('Membership & dues', 'invoices, payment status')}${m('Events', 'registration, sanctioning')}${m('Players & ratings', 'FIDE IDs, reports, titles')}${m('Officers & access', 'who can do what')}</div></section>
  <p class="flowdown">same records, same rules ↕</p>
  <section class="layer core"><h2>FIDE Management System <small>back office · roles, not names</small></h2><div class="mods">${m('Grants · PDC', 'review, approve, pay', 1)}${m('Federations', 'one record per federation', 1)}${m('Membership & dues', 'synced with payments.fide.com')}${m('Events & sanctioning', 'fees, arbiters')}${m('Ratings & titles', 'reports, transfers')}${m('Finance', 'budgets, commitments')}${m('Documents', 'letters, e-signature', 1)}${m('Dashboards', 'KPIs and deadlines', 1)}</div></section>
  <section class="layer"><h2>Shared foundation</h2><div class="mods">${m('Identity', 'ChessID + FIDE ID', 1)}${m('Workflow engine', 'steps, deadlines, reminders', 1)}${m('Notifications', 'email, in-app', 1)}${m('Audit log', 'who did what, when', 1)}</div></section>
  <section class="layer"><h2>Connected systems</h2><div class="mods">${m('payments.fide.com', 'dues and fees')}${m('FIDE rating database', 'players and ratings')}${m('PDC website', 'published results')}${m('Accounting', 'payment exports')}${m('Zoom and calendar', 'pitch booking')}${m('E-signature', 'agreements')}</div></section>
  <div class="stack" style="gap:10px"><h2>Proposed phasing</h2><div class="phases">
    <section class="card pad stack"><p class="eyebrow">Phase 1 · by 1 Mar 2027</p><p>Grants end to end, federation registry, roles and ChessID sign-in, documents and e-signature, dashboards.</p></section>
    <section class="card pad stack"><p class="eyebrow">Phase 2</p><p>Membership and dues with payments.fide.com, events and sanctioning.</p></section>
    <section class="card pad stack"><p class="eyebrow">Phase 3</p><p>Ratings and titles, finance and budgets across commissions.</p></section>
  </div></div></div>`;
}

/* ---------- modal and toast ---------- */
function letterHtml(a) {
  return `<div class="letter"><p class="mono small muted">${a.id} · ${fmt(a.decided.date)}</p><p>To the President, ${esc(fedName(a.fed))}</p>
  <p>The FIDE Planning and Development Commission has approved your application “${esc(a.title)}”.</p>
  <dl><dt>Grant</dt><dd class="mono">${usd(a.approved)}</dd><dt>Payment</dt><dd>70% after signature and bank check, 30% after the final report is approved</dd><dt>Final report</dt><dd>Due ${fmt(addDays(a.end, 30))}, 30 days after the project ends</dd>${a.evaluation && a.evaluation.conditions ? `<dt>Conditions</dt><dd>${esc(a.evaluation.conditions)}</dd>` : ''}</dl>
  <p>Please sign the grant agreement in the Federation Portal. We will ask for bank details after you sign.</p><p>Planning and Development Commission</p></div>`;
}
function publicHtml(a) {
  return `<div class="publiccard"><p class="eyebrow">PDC results · ${a.season}</p><h2>${esc(a.title)}</h2><p class="muted">${esc(fedName(a.fed))} · ${a.cont} · FIDE grant ${usd(a.approved)}</p><div class="ph" role="img" aria-label="Photo placeholder"></div><p>${esc(a.report.summary || '')}</p></div>`;
}
function renderModal() {
  const m = $('#modal');
  if (!state.modal) { m.hidden = true; m.innerHTML = ''; return; }
  m.hidden = false;
  m.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true" aria-label="${esc(state.modal.title)}"><div class="spread"><h2>${esc(state.modal.title)}</h2><button type="button" class="btn small ghost" data-act="closeModal">Close</button></div>${state.modal.html}</div>`;
}
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800); }

/* ---------- render ---------- */
function render() {
  renderChrome();
  renderGuide();
  $('#view').innerHTML = state.app === 'fms' ? renderFMS() : state.app === 'portal' ? renderPortal() : renderArch();
  renderModal();
}
function go() { render(); window.scrollTo(0, 0); }

/* ---------- actions ---------- */
const need = (cond, msg) => { if (!cond) { state.form.err = msg; render(); return false; } return true; };
const A = {
  go: k => { state.app = k; if (k === 'portal' && state.signedIn && state.pview === 'signin') state.pview = 'overview'; go(); },
  reset: () => { state = fresh(); go(); toast('Demo reset'); },
  guide: () => { guide().go(); go(); },
  fv: k => { state.fview = k; state.form = {}; go(); },
  pv: k => { state.pview = k; state.form = {}; if (k === 'apply' && !state.wiz) startWizard(); go(); },
  cont: c => { state.cont = c; render(); },
  signin: () => { state.signedIn = true; state.pview = 'overview'; go(); toast('Signed in with ChessID'); },
  newApp: () => { if (used2027(MYFED) >= 2) return toast('Both project slots for 2027 are used'); startWizard(); go(); },
  track: t => { state.wiz.track = t; render(); },
  slot: i => { state.wiz.slot = +i; state.wiz.err = null; render(); },
  addLine: () => { state.wiz.lines.push({ cat: '', amt: '' }); render(); },
  delLine: i => { if (state.wiz.lines.length > 1) state.wiz.lines.splice(+i, 1); render(); },
  wStep: n => {
    const w = state.wiz; n = +n; w.err = null;
    if (n > w.step) {
      if (w.step === 1 && (!w.title.trim() || !w.summary.trim())) w.err = 'Add a project title and a short description.';
      else if (w.step === 1 && w.end <= w.start) w.err = 'The end date must be after the start date.';
      else if (w.step === 2 && w.slot === null) w.err = 'Choose a time for your pitch.';
      else if (w.step === 3 && w.lines.some(l => !String(l.cat).trim() || !(+l.amt > 0))) w.err = 'Every budget line needs a name and an amount above zero.';
      else if (w.step === 3 && !(wizTotals(w).req > 0)) w.err = 'The requested amount must be above zero. Check the contributions.';
      if (w.err) return render();
    }
    w.step = n; go();
  },
  submitApp: () => {
    const w = state.wiz;
    if (!w.declare) { w.err = 'Confirm that your president or board approved the application.'; return render(); }
    const tt = wizTotals(w);
    const nums = state.apps.filter(a => a.season === 2027).map(a => +a.id.slice(-3));
    const id = 'PDC-2027-' + String(Math.max(...nums) + 1).padStart(3, '0');
    const a = {
      id, fed: MYFED, cont: FEDS[MYFED].cont, season: 2027, title: w.title.trim(), track: w.track, start: w.start, end: w.end, summary: w.summary.trim(), benef: w.benef,
      budget: w.lines.map(l => ({ cat: String(l.cat).trim(), amt: +l.amt })), cofin: { fed: +w.cofinFed || 0, other: +w.cofinOther || 0 }, req: tt.req, requested: tt.req,
      submitted: TODAY, stage: 'councillor', since: TODAY, due: addWD(TODAY, 3), flags: [], approvals: { management: null, treasurer: null }, review: null, evaluation: null,
      signed: null, bank: null, payments: [], report: { due: null, status: 'none' }, decided: null, published: false,
      pitch: { slot: SLOTS[w.slot].t, with: w.track === 'Education' ? 'EDU Commission' : 'PDC' }, history: [],
    };
    a.history.push({ d: TODAY, who: 'Federation', what: 'Short application submitted' }, { d: TODAY, who: 'System', what: 'Pitch booked: ' + a.pitch.slot + ' with ' + a.pitch.with }, { d: TODAY, who: 'Federation', what: 'Full application submitted' }, { d: TODAY, who: 'System', what: 'Eligibility checks passed: window, project limit, dues, reports' }, { d: TODAY, who: 'System', what: 'Routed to Councillor · Africa, due ' + fmt(a.due) });
    state.apps.unshift(a); state.demoId = id; state.wiz = null; state.pview = 'app:' + id; state.form = {};
    go(); toast('Submitted · ' + id);
  },
  score: arg => { const [k, n] = arg.split(':'); state.form.scores = state.form.scores || {}; state.form.scores[k] = +n; state.form.err = null; render(); },
  review: id => {
    const a = byId(id), f = state.form, s = f.scores || {};
    if (!need(CRIT.every(([k]) => s[k]), 'Score all five criteria.')) return;
    if (!need(f.coi, 'Confirm that you have no conflict of interest.')) return;
    const t = CRIT.reduce((x, [k]) => x + s[k], 0);
    a.review = { scores: { ...s }, total: t, comment: (f.comment || '').trim(), coi: true, by: ROLES.councillor.label, date: TODAY };
    move(a, 'commission', ROLES.councillor.label, 'Review submitted: ' + t + ' / 25');
    state.form = {}; go(); toast('Review sent to the commission');
  },
  evalOk: id => {
    const a = byId(id), f = state.form, amt = Math.round(+String(f.amount).replace(/[^0-9.]/g, ''));
    if (!need(amt > 0 && amt <= a.requested, 'Enter an amount between 1 and the requested ' + usd(a.requested) + '.')) return;
    a.evaluation = { rec: 'approve', amount: amt, conditions: (f.conditions || '').trim(), by: ROLES[state.role].label };
    move(a, 'approval', ROLES[state.role].label, 'Recommended for approval: ' + usd(amt));
    state.form = {}; go(); toast('Sent to Management and Treasurer');
  },
  evalNo: id => {
    const a = byId(id), f = state.form;
    if (!need((f.reason || '').trim(), 'Give the reason the federation will see.')) return;
    a.evaluation = { rec: 'decline', reason: f.reason.trim() }; a.declineReason = f.reason.trim();
    a.decided = { date: TODAY, days: wdBetween(a.submitted, TODAY), outcome: 'declined' };
    a.stage = 'declined'; a.since = TODAY; a.due = null; log(a, ROLES[state.role].label, 'Declined: ' + a.declineReason);
    state.form = {}; go(); toast('Declined. The federation has been notified');
  },
  approve: id => {
    const a = byId(id), r = state.role;
    a.approvals[r] = { date: TODAY }; log(a, ROLES[r].label, 'Approved ' + usd(a.evaluation.amount));
    if (a.approvals.management && a.approvals.treasurer) {
      a.approved = a.evaluation.amount;
      a.decided = { date: TODAY, days: wdBetween(a.submitted, TODAY), outcome: 'approved' };
      a.payments = payPlan(a.approved);
      move(a, 'agreement', 'System', 'Decision letter and agreement sent to the federation');
      state.form = {}; go(); toast('Approved. Decision sent to the federation');
    } else { state.form = {}; go(); toast('Approved. Waiting for ' + (r === 'management' ? 'the Treasurer' : 'Management')); }
  },
  returnC: id => {
    const a = byId(id), f = state.form;
    if (!need((f.ret || '').trim(), 'Add a comment so the commission knows what to change.')) return;
    a.approvals = { management: null, treasurer: null };
    move(a, 'commission', ROLES[state.role].label, 'Returned to commission: ' + f.ret.trim());
    state.form = {}; go(); toast('Returned to the commission');
  },
  hold: id => { const a = byId(id); log(a, 'Secretariat', 'On hold until the overdue report arrives; federation notified'); state.form = {}; render(); toast('Federation notified'); },
  override: id => {
    const a = byId(id), f = state.form;
    if (!need((f.note || '').trim(), 'Add a note explaining the override.')) return;
    a.flags = []; move(a, 'councillor', 'Secretariat', 'Check overridden: ' + f.note.trim());
    state.form = {}; go(); toast('Routed to the councillor');
  },
  pitchHeld: id => { const a = byId(id); move(a, 'full', 'Secretariat', 'Pitch held; full application form sent to the federation'); state.form = {}; go(); toast('Full application form sent'); },
  sign: id => {
    const a = byId(id), f = state.form;
    if (!need((f.signName || '').trim(), 'Type your full name to sign.')) return;
    if (!need(f.auth, 'Confirm that you are authorised to sign for the federation.')) return;
    a.signed = { by: f.signName.trim(), date: TODAY }; a.report.due = addDays(a.end, 30);
    log(a, 'Federation', 'Agreement signed by ' + a.signed.by);
    state.form = {}; render(); toast('Agreement signed');
  },
  attach: () => { state.form.letter = 'bank-confirmation-letter.pdf'; state.form.err = null; render(); },
  bank: id => {
    const a = byId(id), f = state.form;
    if (!need(['holder', 'bankName', 'iban', 'swift'].every(k => (f[k] || '').trim()), 'Fill in all four bank fields.')) return;
    if (!need(f.letter, 'Attach the bank confirmation letter.')) return;
    a.bank = { holder: f.holder.trim(), bankName: f.bankName.trim(), iban: f.iban.trim(), swift: f.swift.trim(), letter: f.letter, verified: false };
    move(a, 'payment', 'Federation', 'Bank details submitted with confirmation letter');
    state.form = {}; go(); toast('Bank details sent to Accounting');
  },
  pay: id => {
    const a = byId(id), f = state.form;
    if (!need(f.callback, 'Confirm the call-back to the federation’s registered contact.')) return;
    a.bank.verified = true; a.payments[0].status = 'paid'; a.payments[0].date = TODAY;
    move(a, 'project', 'Accounting', 'Bank details verified by call-back; tranche 1 paid: ' + usd(a.payments[0].amt));
    state.form = {}; go(); toast('Tranche 1 paid');
  },
  report: id => {
    const a = byId(id), f = state.form;
    if (!need((f.rsum || '').trim() && (f.rpart || '').trim(), 'Describe what happened and how many people took part.')) return;
    a.report = { ...a.report, status: 'submitted', summary: f.rsum.trim(), participants: f.rpart.trim(), spent: +String(f.rspent).replace(/[^0-9.]/g, '') || 0, photos: 3, consent: !!f.consent, date: TODAY };
    move(a, 'report', 'Federation', 'Final report submitted');
    state.form = {}; go(); toast('Report submitted');
  },
  rApprove: id => {
    const a = byId(id);
    a.report.status = 'approved'; a.payments[1].status = 'paid'; a.payments[1].date = TODAY; a.published = true;
    move(a, 'closed', 'Grants coordinator', 'Report approved; tranche 2 released; results published on the PDC website');
    state.form = {}; go(); toast('Published on the PDC website');
  },
  rChanges: id => {
    const a = byId(id), f = state.form;
    if (!need((f.rc || '').trim(), 'Add a comment so the federation knows what to change.')) return;
    a.report.status = 'changes'; move(a, 'project', 'Grants coordinator', 'Changes requested: ' + f.rc.trim());
    state.form = {}; go(); toast('Sent back to the federation');
  },
  letter: id => { state.modal = { title: 'Decision letter', html: letterHtml(byId(id)) }; renderModal(); },
  public: id => { state.modal = { title: 'Public page preview', html: publicHtml(byId(id)) }; renderModal(); },
  closeModal: () => { state.modal = null; renderModal(); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t.dataset.arg); }
});
document.addEventListener('click', e => { if (e.target.id === 'modal') A.closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.modal) A.closeModal(); });
function onField(e) {
  const t = e.target;
  if (t.id === 'role-select') { state.role = t.value; state.form = {}; return go(); }
  const val = t.type === 'checkbox' ? t.checked : t.value;
  if (t.dataset.f !== undefined) { state.form[t.dataset.f] = val; if (state.form.err && e.type === 'change') { state.form.err = null; } }
  else if (t.dataset.w !== undefined && state.wiz) { state.wiz[t.dataset.w] = val; }
  else if (t.dataset.line !== undefined && state.wiz) { state.wiz.lines[+t.dataset.line][t.dataset.lf] = val; }
  if (state.wiz && (t.dataset.line !== undefined || t.dataset.w === 'cofinFed' || t.dataset.w === 'cofinOther')) {
    const tt = wizTotals(state.wiz); const st = $('#sum-t'), sr = $('#sum-r');
    if (st) st.textContent = usd(tt.t); if (sr) sr.textContent = usd(tt.req);
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', e => { if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT') onField(e); });

render();
</script>

</body>
</html>
