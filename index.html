<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FIDE Digital Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;600;700&display=swap">
<style>
/* Layout: FIDE-navy product bar + demo guide on top. FIDE Core = FIDE palette (navy #24305E, blue #374785, page #EAEEF3, raspberry #CC3366), dense back office with sidebar. FIDE Connect and FIDE ChessID = warm ChessID front office in a centred column. */
:root {
  --bg: #EAEEF3; --surface: #FFFFFF; --surface-2: #E3E8EF; --line: #D3D9E4; --line-2: #C6CDDD;
  --text: #24305E; --text-2: #4F5B7D; --text-3: #69749A;
  --accent: #374785; --accent-ink: #FFFFFF; --accent-soft: #E1E6F2; --hot: #CC3366;
  --paper: #FAF8F4; --p-surface: #FFFFFF; --p-surface-2: #F3F0E9; --p-line: #E3DED2; --p-line-2: #D5CFC2; --p-text: #1A1814; --p-text-2: #6B6558;
  --gold: #7E5F22; --gold-hi: #E0C288; --gold-mid: #B08A3E; --gold-soft: #F6EEDB;
  --good: #2C7550; --good-soft: #E3F1E8; --warn: #8A5D0B; --warn-soft: #FBF0D9; --bad: #AE3427; --bad-soft: #FBE6E2;
  --chrome: #24305E; --chrome-2: #2F3C70; --chrome-line: #45528A; --chrome-text: #FFFFFF; --chrome-dim: #BAC3DD;
  --shadow: 0 1px 2px rgba(36, 48, 94, .06), 0 6px 20px -12px rgba(36, 48, 94, .22);
  --scrim: rgba(16, 22, 43, .5);
  --sans: Roboto, ui-sans-serif, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1424; --surface: #171D33; --surface-2: #1E2540; --line: #2A3354; --line-2: #3A4570;
    --text: #E8ECF6; --text-2: #A6AFCB; --text-3: #8C95B3;
    --accent: #9CACEB; --accent-ink: #121833; --accent-soft: #232C52; --hot: #F07AA0;
    --paper: #13120F; --p-surface: #1C1A16; --p-surface-2: #24211B; --p-line: #353027; --p-line-2: #45403A; --p-text: #F2EEE6; --p-text-2: #A39B8B;
    --gold: #D9B266; --gold-hi: #F0DCAE; --gold-mid: #C69C50; --gold-soft: #2E2617;
    --good: #73C496; --good-soft: #16291E; --warn: #E3B45C; --warn-soft: #30250F; --bad: #F2907F; --bad-soft: #371B17;
    --chrome: #10162B; --chrome-2: #1C2340; --chrome-line: #33406B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 24px -14px rgba(0, 0, 0, .7);
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1424; --surface: #171D33; --surface-2: #1E2540; --line: #2A3354; --line-2: #3A4570;
  --text: #E8ECF6; --text-2: #A6AFCB; --text-3: #8C95B3;
  --accent: #9CACEB; --accent-ink: #121833; --accent-soft: #232C52; --hot: #F07AA0;
  --paper: #13120F; --p-surface: #1C1A16; --p-surface-2: #24211B; --p-line: #353027; --p-line-2: #45403A; --p-text: #F2EEE6; --p-text-2: #A39B8B;
  --gold: #D9B266; --gold-hi: #F0DCAE; --gold-mid: #C69C50; --gold-soft: #2E2617;
  --good: #73C496; --good-soft: #16291E; --warn: #E3B45C; --warn-soft: #30250F; --bad: #F2907F; --bad-soft: #371B17;
  --chrome: #10162B; --chrome-2: #1C2340; --chrome-line: #33406B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 24px -14px rgba(0, 0, 0, .7);
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.small { font-size: 12.5px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(22px, 3vw, 28px); font-weight: 600; line-height: 1.2; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* top: product bar + guide */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.chrome { background: var(--chrome); color: var(--chrome-text); }
.chrome-in { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 54px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mark { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
.mark-k { background: var(--chrome-text); color: var(--chrome); font-size: 12px; letter-spacing: .14em; padding: 3px 7px 3px 8px; border-radius: 3px; }
.mark-t { font-size: 13px; color: var(--chrome-dim); font-weight: 500; }
.prod { display: flex; gap: 2px; background: var(--chrome-2); padding: 3px; border-radius: 8px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.prod button { border: 0; background: none; color: var(--chrome-dim); padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 500; display: flex; gap: 6px; align-items: baseline; }
.prod button small { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.prod button:hover { color: var(--chrome-text); }
.prod button[aria-pressed="true"] { background: var(--chrome-text); color: var(--chrome); }
.chrome-r { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rolepick { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--chrome-dim); }
.rolepick select { background: var(--chrome-2); color: var(--chrome-text); border: 1px solid var(--chrome-line); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
.today { font-size: 11.5px; color: var(--chrome-dim); border: 1px solid var(--chrome-line); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.cbtn { background: none; border: 1px solid var(--chrome-line); color: var(--chrome-text); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.cbtn:hover { background: var(--chrome-2); }
.guide { background: var(--surface); border-bottom: 1px solid var(--line); }
.guide-in { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.g-step { font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
.g-bar { width: 90px; height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; flex: none; }
.g-bar i { display: block; height: 100%; background: var(--hot); }
.g-text { flex: 1 1 260px; min-width: 0; font-size: 13.5px; }

/* shared components */
.btn { border: 1px solid transparent; border-radius: 8px; padding: 9px 16px; font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.small { padding: 6px 12px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }
.linkbtn:hover { text-decoration: underline; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 18px 20px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.spread { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--text-2); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge { margin-left: auto; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; border-radius: 99px; padding: 0 7px; line-height: 18px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; flex: none; }
.err { color: var(--bad); font-size: 13px; font-weight: 500; }
.note { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text-2); }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12px; font-weight: 600; color: var(--text-2); }
.field input, .field select, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.field input[readonly] { background: var(--surface-2); color: var(--text-2); }
.field textarea { resize: vertical; }
.field small { font-size: 12px; color: var(--text-2); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; }
.check input { margin-top: 3px; accent-color: var(--accent); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: top; }
th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); font-weight: 600; background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 600; border-bottom: 0; }
.tscroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.tscroll table { min-width: 480px; }
.tscroll tr:last-child td { border-bottom: 0; }

/* impact tiles and chart */
.imp { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.itile { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; background: var(--surface); }
.itile.hero { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.itile .k { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 12px; color: var(--text-2); font-weight: 600; }
.itile .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.itile .s { font-size: 12px; color: var(--text-2); }
.src { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.src.cid { background: var(--accent-soft); color: var(--accent); }
.tbar { height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.tbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.chart { margin: 0; display: grid; gap: 8px; }
.chart-wrap { overflow-x: auto; }
.chart svg { width: 100%; min-width: 480px; max-width: 760px; height: auto; display: block; }
.chart text { font-family: var(--sans); font-size: 11px; fill: var(--text-2); }
.chart .lbl { font-size: 11.5px; font-weight: 600; fill: var(--text); }
.chart figcaption { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.chart figcaption span { display: inline-flex; align-items: center; gap: 6px; }
.chart figcaption i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.callout { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-size: 14px; }
.callout b { font-variant-numeric: tabular-nums; }

/* FIDE Core */
.fms { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 110px); }
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 10px; gap: 14px; padding-left: max(10px, env(safe-area-inset-left, 0px)); }
.side-h { padding: 0 8px; display: grid; }
.side-h b { font-size: 15px; }
.side-h span { font-size: 12px; color: var(--text-2); }
.snav { display: grid; gap: 2px; }
.snav-i { display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--text-2); font-weight: 500; white-space: nowrap; }
.snav-i:hover { background: var(--surface-2); color: var(--text); }
.snav-i.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.snav-i .soon { margin-left: auto; font-size: 10.5px; color: var(--text-3); font-weight: 500; }
.side-f { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 10px 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); }
.fmain { padding: 24px 28px 64px; display: grid; gap: 20px; align-content: start; min-width: 0; }
.phead-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: grid; gap: 4px; }
.kpi .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .s { font-size: 12.5px; color: var(--text-2); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.list { display: grid; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .t { display: grid; gap: 2px; min-width: 0; }
.li .t b { font-weight: 600; }
.li .t span { font-size: 12.5px; color: var(--text-2); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fpill { border: 1px solid var(--line-2); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; color: var(--text-2); }
.fpill[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: 206px; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 0 2px; }
.kcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 5px; cursor: pointer; box-shadow: var(--shadow); }
.kcard:hover { border-color: var(--line-2); }
.kcard.mine { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
.kcard .id { font-size: 11.5px; color: var(--text-2); }
.kcard b { font-size: 13px; font-weight: 600; line-height: 1.3; }
.kcard .f { font-size: 12px; color: var(--text-2); }
.kcard .ft { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.bars { display: grid; gap: 14px; }
.barrow { display: grid; gap: 5px; }
.barrow .lbl { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; flex-wrap: wrap; }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; }
.bar i.req { background: var(--line-2); }
.bar i.app { background: var(--accent); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.track { list-style: none; margin: 0; padding: 0; display: grid; }
.track li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 7px 0; position: relative; }
.track li::before { content: ""; position: absolute; left: 8px; top: 22px; bottom: -8px; width: 2px; background: var(--line); }
.track li:last-child::before { display: none; }
.tdot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); margin-top: 1px; z-index: 1; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.track li.done .tdot { background: var(--good); border-color: var(--good); color: var(--surface); }
.track li.skip .tdot { border-style: dashed; }
.track li.cur .tdot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.track li.bad .tdot { background: var(--bad); border-color: var(--bad); }
.track b { display: block; font-weight: 600; font-size: 13.5px; }
.track li.todo b, .track li.skip b { color: var(--text-2); font-weight: 500; }
.track small { font-size: 12px; color: var(--text-2); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.checks li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.checks .ok { color: var(--good); font-weight: 700; }
.checks .no { color: var(--bad); font-weight: 700; }
.checks span small { display: block; color: var(--text-2); font-size: 12px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.log li { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; font-size: 12.5px; }
.log time { color: var(--text-2); font-family: var(--mono); font-size: 11.5px; padding-top: 1px; }
.log b { font-weight: 600; }
.act { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent), var(--shadow); }
.waiting { display: flex; gap: 12px; align-items: center; }
.crit { display: grid; gap: 8px; }
.crow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13.5px; }
.pills { display: flex; gap: 4px; }
.pill { width: 34px; height: 30px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 600; font-family: var(--mono); }
.pill:hover { border-color: var(--accent); }
.pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scoregrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scoregrid div { background: var(--surface-2); border-radius: 7px; padding: 7px 8px; display: grid; gap: 1px; }
.scoregrid small { font-size: 11px; color: var(--text-2); line-height: 1.25; }
.scoregrid b { font-family: var(--mono); font-size: 15px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 0; }
.kv dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); font-weight: 600; }
.kv dd { margin: 2px 0 0; font-weight: 500; }
.topics { display: grid; gap: 8px; }
.quote { border-left: 3px solid var(--line-2); padding: 2px 0 2px 12px; display: grid; gap: 6px; }
.files { display: flex; gap: 6px; flex-wrap: wrap; }
.file { font-size: 12px; font-family: var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.terms { display: grid; gap: 10px; }
.term { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.term:last-child { border-bottom: 0; }

function fTracker(a) {

function cTrack(a) {

  }).join('')}</ol>`;
}
function cNext(a) {

      else if (w.step === 1 && w.end <= w.start) w.err = 'The end date must be after the start date.';
      else if (w.step === 2 && w.lines.some(l => !String(l.cat).trim() || !(+l.amt > 0))) w.err = 'Every budget line needs a name and an amount above zero.';
      else if (w.step === 2 && !(wizTotals(w).req > 0)) w.err = 'The requested amount must be above zero. Check the contributions.';
      else if (w.step === 3 && Object.values(w.targets).some(v => !(int(v) > 0))) w.err = 'Every target needs a number above zero.';
      else if (w.step === 3 && int(w.targets.womenPct) > 100) w.err = 'The share of women and girls cannot be above 100%.';
      if (w.err) return render();
    }
    w.step = n; go();
  },
  submitApp: () => {
    const w = state.wiz;
    if (!w.declare) { w.err = 'Confirm that your president or board approved the application.'; return render(); }
    const tt = wizTotals(w);
    const nums = state.apps.filter(a => a.season === 2027).map(a => +a.id.slice(-3));
    const id = 'PDC-2027-' + String(Math.max(...nums) + 1).padStart(3, '0');
    const t = {}; Object.keys(w.targets).forEach(k => { t[k] = int(w.targets[k]); });
    const a = {
      id, fed: MYORG, cont: FEDS[MYORG].cont, season: 2027, title: w.title.trim(), track: w.track, start: w.start, end: w.end, summary: w.summary.trim(), benef: w.benef,
      budget: w.lines.map(l => ({ cat: String(l.cat).trim(), amt: +l.amt })), cofin: { fed: +w.cofinFed || 0, other: +w.cofinOther || 0 }, req: tt.req, requested: tt.req, targets: t,
      submitted: TODAY, stage: 'application', since: TODAY, due: addWD(TODAY, 2), flags: [], approvals: { management: null, treasurer: null }, revision: null, review: null, evaluation: null,
      agreement: null, signed: null, bank: null, payments: [], report: { due: null, status: 'none' }, impact: null, decided: null, published: false, history: [],
    };
    a.history.push({ d: TODAY, who: 'Federation', what: 'Application submitted in FIDE Connect' }, { d: TODAY, who: 'System', what: 'Routed to Secretariat for a first look, due ' + fmt(a.due) });
    state.apps.unshift(a); state.demoId = id; state.wiz = null; state.pview = 'app:' + id; state.form = {};
    go(); toast('Submitted · ' + id);
  },
  askRev: id => {
    const a = byId(id), f = state.form;
    if (!need(f.topics.length || (f.msg || '').trim(), 'Choose at least one topic or write a message.')) return;
    a.revision = { date: TODAY, topics: f.topics.map(i => REV_TOPICS[i]), message: (f.msg || '').trim(), answer: null };
    move(a, 'revision', 'Secretariat', 'Requested more information: ' + a.revision.topics.join('; '));
    state.form = {}; go(); toast('Request sent to the federation');
  },
  toCheck: id => { const a = byId(id); a.complete = TODAY; move(a, 'check', 'Secretariat', 'No questions; sent to check'); state.form = {}; go(); toast('Sent to check'); },
  attachRev: () => { state.form.files = ['schools-list.xlsx', 'lead-coaches-cv.pdf']; state.form.err = null; render(); },
  sendAns: id => {
    const a = byId(id), f = state.form;
    if (!need((f.ans || '').trim(), 'Write your answer to FIDE.')) return;
    if (!need(f.files && f.files.length, 'Attach the documents FIDE asked for.')) return;
    a.revision.answer = { date: TODAY, text: f.ans.trim(), files: f.files.slice() };
    a.complete = TODAY;
    move(a, 'check', 'Federation', 'Answered FIDE’s request with ' + f.files.length + ' files; application complete');
    state.form = {}; go(); toast('Answer sent to FIDE');
  },
  checkOk: id => { const a = byId(id); move(a, 'councillor', 'Secretariat', 'Checks passed; routed to Councillor · ' + a.cont); state.form = {}; go(); toast('Sent to the councillor'); },
  checkBack: id => {
    const a = byId(id), f = state.form;
    if (!need((f.note || '').trim(), 'Add a note so the federation knows what to fix.')) return;
    a.revision = { date: TODAY, topics: ['Check found an issue'], message: f.note.trim(), answer: null };
    move(a, 'revision', 'Secretariat', 'Returned for revision: ' + f.note.trim());
    state.form = {}; go(); toast('Returned to the federation');
  },
  score: arg => { const [k, n] = arg.split(':'); state.form.scores = state.form.scores || {}; state.form.scores[k] = +n; state.form.err = null; render(); },
  review: id => {
    const a = byId(id), f = state.form, s = f.scores || {};
    if (!need(CRIT.every(([k]) => s[k]), 'Score all five criteria.')) return;
    if (!need(f.coi, 'Confirm that you have no conflict of interest.')) return;
    const t = CRIT.reduce((x, [k]) => x + s[k], 0);
    a.review = { scores: { ...s }, total: t, comment: (f.comment || '').trim(), coi: true, by: ROLES.councillor.label, date: TODAY };
    move(a, 'commission', ROLES.councillor.label, 'Evaluation submitted: ' + t + ' / 25');
    state.form = {}; go(); toast('Evaluation sent to the commission');
  },
  evalOk: id => {
    const a = byId(id), f = state.form, amt = int(f.amount);
    if (!need(amt > 0 && amt <= a.requested, 'Enter an amount between 1 and the requested ' + usd(a.requested) + '.')) return;
    a.evaluation = { rec: 'approve', amount: amt, conditions: (f.conditions || '').trim(), by: ROLES[state.role].label };
    move(a, 'approval', ROLES[state.role].label, 'Recommended for approval: ' + usd(amt));
    state.form = {}; go(); toast('Sent to Management and Treasurer');
  },
  evalNo: id => {
    const a = byId(id), f = state.form;
    if (!need((f.reason || '').trim(), 'Give the reason the federation will see.')) return;
    a.evaluation = { rec: 'decline', reason: f.reason.trim() }; a.declineReason = f.reason.trim();
    a.decided = { date: TODAY, days: Math.max(1, wdBetween(a.complete || a.submitted, TODAY)), outcome: 'declined' };
    a.stage = 'declined'; a.since = TODAY; a.due = null; log(a, ROLES[state.role].label, 'Declined: ' + a.declineReason);
    state.form = {}; go(); toast('Declined. The federation has been notified');
  },
  approve: id => {
    const a = byId(id), r = state.role;
    a.approvals[r] = { date: TODAY }; log(a, ROLES[r].label, 'Approved ' + usd(a.evaluation.amount));
    if (a.approvals.management && a.approvals.treasurer) {
      a.approved = a.evaluation.amount;
      a.decided = { date: TODAY, days: Math.max(1, wdBetween(a.complete || a.submitted, TODAY)), outcome: 'approved' };
      a.payments = payPlan(a.approved);
      a.agreement = { sent: TODAY };
      move(a, 'agreement', 'System', 'Decision letter and agreement sent to the federation in FIDE Connect');
      state.form = {}; go(); toast('Approved. Decision and agreement sent');
    } else { state.form = {}; go(); toast('Approved. Waiting for ' + (r === 'management' ? 'the Treasurer' : 'Management')); }
  },
  returnC: id => {
    const a = byId(id), f = state.form;
    if (!need((f.ret || '').trim(), 'Add a comment so the commission knows what to change.')) return;
    a.approvals = { management: null, treasurer: null };
    move(a, 'commission', ROLES[state.role].label, 'Returned to commission: ' + f.ret.trim());
    state.form = {}; go(); toast('Returned to the commission');
  },
  hold: id => { const a = byId(id); log(a, 'Secretariat', 'On hold until the overdue report arrives; federation notified'); state.form = {}; render(); toast('Federation notified'); },
  override: id => {
    const a = byId(id), f = state.form;
    if (!need((f.note || '').trim(), 'Add a note explaining the override.')) return;
    a.flags = []; move(a, 'councillor', 'Secretariat', 'Check overridden: ' + f.note.trim());
    state.form = {}; go(); toast('Routed to the councillor');
  },
  sign: id => {
    const a = byId(id), f = state.form;
    if (!need(f.accept, 'Accept the agreement terms, including termination, penalties and sanctions.')) return;
    if (!need((f.signName || '').trim(), 'Type your full name to sign.')) return;
    if (!need(f.auth, 'Confirm that you are authorised to sign for the federation.')) return;
    a.signed = { by: f.signName.trim(), date: TODAY }; a.report.due = addDays(a.end, 30); a.code = eventCode(a);
    move(a, 'payment', 'Federation', 'Agreement signed by ' + a.signed.by + '; project code ' + a.code + ' issued');
    state.form = {}; go(); toast('Agreement signed');
  },
  attach: () => { state.form.letter = 'bank-confirmation-letter.pdf'; state.form.err = null; render(); },
  bank: id => {
    const a = byId(id), f = state.form;
    if (!need(['holder', 'bankName', 'iban', 'swift'].every(k => (f[k] || '').trim()), 'Fill in all four bank fields.')) return;
    if (!need(f.letter, 'Attach the bank confirmation letter.')) return;
    a.bank = { holder: f.holder.trim(), bankName: f.bankName.trim(), iban: f.iban.trim(), swift: f.swift.trim(), letter: f.letter, verified: false };
    a.since = TODAY; a.due = addWD(TODAY, 10); log(a, 'Federation', 'Bank details submitted with confirmation letter');
    state.form = {}; go(); toast('Bank details sent to Accounting');
  },
  pay: id => {
    const a = byId(id), f = state.form;
    if (!need(f.callback, 'Confirm the call-back to the federation’s registered contact.')) return;
    a.bank.verified = true; a.payments[0].status = 'paid'; a.payments[0].date = TODAY;
    move(a, 'project', 'Accounting', 'Bank details verified by call-back; tranche 1 paid: ' + usd(a.payments[0].amt));
    state.form = {}; go(); toast('Tranche 1 paid');
  },
  report: id => {
    const a = byId(id), f = state.form;
    if (!need((f.rsum || '').trim(), 'Describe what happened in the project.')) return;
    if (!need(int(f.r_participants) > 0, 'Enter the total number of participants.')) return;
    const rd = reportDate(a);
    a.impact = { participants: int(f.r_participants), coaches: int(f.r_coaches), venues: int(f.r_venues), reach: int(f.r_reach), media: int(f.r_media), spent: int(f.r_spent), summary: f.rsum.trim(), consent: !!f.consent, photos: 3 };
    a.report = { ...a.report, status: 'submitted', date: rd };
    move(a, 'report', 'Federation', 'Final report submitted with ChessID figures', rd);
    state.form = {}; go(); toast('Report submitted');
  },
  rApprove: id => {
    const a = byId(id), d = addWD(a.report.date, 3);
    a.report.status = 'approved'; a.payments[1].status = 'paid'; a.payments[1].date = d; a.published = true;
    move(a, 'closed', 'Grants coordinator', 'Report approved; tranche 2 released; results published on the PDC website', d);
    state.form = {}; go(); toast('Published on the PDC website');
  },
  rChanges: id => {
    const a = byId(id), f = state.form;
    if (!need((f.rc || '').trim(), 'Add a comment so the federation knows what to change.')) return;
    a.report.status = 'changes'; a.impact = null; move(a, 'project', 'Grants coordinator', 'Changes requested: ' + f.rc.trim(), a.report.date);
    state.form = {}; go(); toast('Sent back to the federation');
  },
  terminate: id => {
    const a = byId(id), f = state.form;
    if (!need((f.term || '').trim(), 'Give the reason for termination.')) return;
    a.termination = { reason: f.term.trim(), date: TODAY, ban: !!f.ban };
    if (a.payments[1]) a.payments[1].status = 'cancelled';
    if (f.ban) FEDS[a.fed].ban = 'Banned from PDC funding until 31 Dec 2029: agreement ' + a.id + ' terminated';
    a.stage = 'terminated'; a.since = TODAY; a.due = null;
    log(a, 'Grants coordinator', 'Agreement terminated: ' + a.termination.reason + (f.ban ? '; PDC funding ban applied' : ''));
    state.form = {}; go(); toast('Agreement terminated');
  },
  letter: id => { state.modal = { title: 'Decision letter', html: letterHtml(byId(id)) }; renderModal(); },
  agreementDoc: id => { const a = byId(id); state.modal = { title: 'Grant agreement · ' + a.id, html: terms(a) }; renderModal(); },
  public: id => { state.modal = { title: 'Public page preview', html: publicHtml(byId(id)) }; renderModal(); },
  closeModal: () => { state.modal = null; renderModal(); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t.dataset.arg); }
});
document.addEventListener('click', e => { if (e.target.id === 'modal') A.closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.modal) A.closeModal(); });
function onField(e) {
  const t = e.target;
  if (t.id === 'role-select') { state.role = t.value; state.form = {}; return go(); }
  const val = t.type === 'checkbox' ? t.checked : t.value;
  if (t.dataset.topic !== undefined) {
    const i = +t.dataset.topic, xs = state.form.topics || (state.form.topics = []);
    if (t.checked && !xs.includes(i)) xs.push(i);
    if (!t.checked) state.form.topics = xs.filter(x => x !== i);
  } else if (t.dataset.f !== undefined) { state.form[t.dataset.f] = val; }
  else if (t.dataset.w !== undefined && state.wiz) { state.wiz[t.dataset.w] = val; }
  else if (t.dataset.t !== undefined && state.wiz) { state.wiz.targets[t.dataset.t] = val; }
  else if (t.dataset.line !== undefined && state.wiz) { state.wiz.lines[+t.dataset.line][t.dataset.lf] = val; }
  if (state.wiz && (t.dataset.line !== undefined || t.dataset.w === 'cofinFed' || t.dataset.w === 'cofinOther')) {
    const tt = wizTotals(state.wiz); const st = $('#sum-t'), sr = $('#sum-r');
    if (st) st.textContent = usd(tt.t); if (sr) sr.textContent = usd(tt.req);
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', e => { if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT') onField(e); });

render();
</script>

</body>
